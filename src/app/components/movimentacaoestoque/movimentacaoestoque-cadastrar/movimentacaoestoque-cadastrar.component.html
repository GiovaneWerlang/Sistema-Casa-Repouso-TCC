<div class="col-12 flex flex-column align-items-center">
    <div class="col-12 xl:col-10 lg:col-10 md:col-10 sm:col-10 pb-0">
        <div class="card-title">
            <span class="font-bold text-2xl" style="color: var(--primary-color);">Cadastro de Movimentação de Medicamento</span>
        </div>
        <form [formGroup]="form" (submit)="salvar()" class="flex flex-column card-body">
            <div class="flex flex-row flex-wrap">
                <div class="col-12 xl:col-4 lg:col-4 md:col-4 sm:col-12 flex flex-column">
                    <label htmlFor="qtde">Quantidade:</label>
                    <input type="number" pInputText pKeyFilter="int" name="qtde" formControlName="qtde" />
                    <div *ngIf="form.controls['qtde']?.invalid && (form.controls['qtde']?.dirty || form.controls['qtde']?.touched)">
                        <small *ngIf="form.get('qtde')?.errors?.['required']" class="p-error">Este campo é obrigatório.</small>
                        <small *ngIf="form.get('qtde')?.errors?.['min']" class="p-error">Valor mínimo 1.</small>
                        <small *ngIf="form.get('qtde')?.errors?.['max']" class="p-error">Valor máximo 2147483647.</small>
                    </div>
                </div>
                <div class="col-12 xl:col-4 lg:col-4 md:col-4 sm:col-12 flex flex-column">
                    <label htmlFor="tipo">Tipo:</label>
                    <p-dropdown [options]="opcoesTipo" name="tipo" formControlName="tipo" [style]="{'width':'100%'}"/>
                    <div *ngIf="form.controls['tipo']?.invalid && (form.controls['tipo']?.dirty || form.controls['tipo']?.touched)">
                        <small *ngIf="form.get('tipo')?.errors?.['required']" class="p-error">Este campo é obrigatório.</small>
                    </div>
                </div>
                <div class="col-12 xl:col-4 lg:col-4 md:col-4 sm:col-12 flex flex-column">
                    <label htmlFor="medicamento">Medicamento:</label>
                    <p-dropdown [options]="opcoesMedicamento" name="medicamento" formControlName="medicamento" [filter]="true" [style]="{'width':'100%'}"/>
                    <div *ngIf="form.controls['medicamento']?.invalid && (form.controls['medicamento']?.dirty || form.controls['medicamento']?.touched)">
                        <small *ngIf="form.get('medicamento')?.errors?.['required']" class="p-error">Este campo é obrigatório.</small>
                    </div>
                </div>                
            </div>
        </form>
    </div>
    <div class="col-12 xl:col-10 lg:col-10 md:col-10 sm:col-10 pt-0">
        <div class="card-footer col-12 flex align-items-center justify-content-between">
            <p-button (click)="voltar()" pTooltip="Voltar" tooltipPosition="top" icon="pi pi-arrow-left"
                [style]="{'float': 'left'}"
                styleClass="p-button-rounded p-button-info p-button-text p-button-lg"></p-button>
                <div class="flex flex-row justify-content-end gap-2">
                    <button pButton class="p-button p-button-primary" (click)="salvar()">Salvar</button>
                    <button pButton class="p-button p-button-secondary" (click)="limpar()">Limpar</button>
                </div>
        </div>
    </div>
</div>
