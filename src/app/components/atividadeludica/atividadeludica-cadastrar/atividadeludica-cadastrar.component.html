<div class="col-12 flex flex-column align-items-center">
  <div class="col-12 xl:col-10 lg:col-10 md:col-10 sm:col-10 pb-0">
    <div class="card-title">
        <span class="font-bold text-2xl" style="color: var(--primary-color);">Cadastro de Atividade Lúdica</span>
    </div>
    <form [formGroup]="form" (submit)="salvar()" class="flex flex-column card-body">
      <div class="flex flex-row flex-wrap">
        <div class="col-12 xl:col-12 lg:col-12 md:col-12 sm:col-12 flex flex-column">
          <label htmlFor="nome">Nome:</label>
          <input type="text" pInputText name="nome" formControlName="nome" />
          <div *ngIf="form.controls['nome']?.invalid && (form.controls['nome']?.dirty || form.controls['nome']?.touched)">
            <small *ngIf="form.get('nome')?.errors?.['required']" class="p-error">Este campo é obrigatório.</small>
            <small *ngIf="form.get('nome')?.errors?.['maxlength']" class="p-error">Tamanho máximo 255 caracteres.</small>
          </div>
        </div>
        <div class="col-4 xl:col-4 lg:col-4 md:col-4 sm:col-4 flex flex-column">
          <label htmlFor="dataHora">DataHora:</label>
          <p-calendar type="text" [showTime]="true" name="dataHora" formControlName="dataHora" [style]="{'width':'100%'}" [inputStyle]="{'width':'100%'}"/>
          <div *ngIf="form.controls['dataHora']?.invalid && (form.controls['dataHora']?.dirty || form.controls['dataHora']?.touched)">
            <small *ngIf="form.get('dataHora')?.errors?.['required']" class="p-error">Este campo é obrigatório.</small>
          </div>
        </div>
        <div class="col-4 xl:col-4 lg:col-4 md:col-4 sm:col-4 flex flex-column">
          <label htmlFor="situacao">Situação:</label>
          <p-dropdown [options]="opcoesSituacao" name="situacao" formControlName="situacao" [style]="{'width':'100%'}"/>
          <div *ngIf="form.controls['situacao']?.invalid && (form.controls['situacao']?.dirty || form.controls['situacao']?.touched)">
            <small *ngIf="form.get('situacao')?.errors?.['required']" class="p-error">Este campo é obrigatório.</small>
          </div>
        </div>
      </div>
    </form>
  </div>
  <div class="col-12 xl:col-10 lg:col-10 md:col-10 sm:col-10 pt-0">
    <div class="card-footer col-12 flex align-items-center justify-content-between">
        <p-button (click)="voltar()" pTooltip="Voltar" tooltipPosition="top" icon="pi pi-arrow-left"
            [style]="{'float': 'left'}"
            styleClass="p-button-rounded p-button-info p-button-text p-button-lg"></p-button>
            <div class="flex flex-row justify-content-end gap-2">
                <button pButton class="p-button p-button-primary" (click)="salvar()">Salvar</button>
                <button pButton class="p-button p-button-secondary" (click)="limpar()">Limpar</button>
            </div>
    </div>
</div>
</div>
