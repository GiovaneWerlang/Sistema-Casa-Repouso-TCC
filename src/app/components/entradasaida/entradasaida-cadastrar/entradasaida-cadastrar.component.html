<div class="col-12 flex flex-column align-items-center">
    <div class="col-12 xl:col-10 lg:col-10 md:col-10 sm:col-10">
      <p>Cadastro de Entradas e Saídas</p>
      <form [formGroup]="form" (submit)="salvar()" class="flex flex-column">
        <div class="flex flex-row flex-wrap">
          <div class="col-12 xl:col-10 lg:col-10 md:col-10 sm:col-10 flex flex-column">
            <label htmlFor="descricao">Descrição:</label>
            <input type="text" pInputText name="descricao" formControlName="descricao" />
          </div>
          <div class="col-4 xl:col-4 lg:col-4 md:col-4 sm:col-4 flex flex-column">
            <label htmlFor="dataHoraSaida">DataHora Saida:</label>
            <p-calendar type="text" [showTime]="true" name="dataHoraSaida" formControlName="dataHoraSaida" />
          </div>
          <div class="col-4 xl:col-4 lg:col-4 md:col-4 sm:col-4 flex flex-column">
            <label htmlFor="dataHoraEntrada">DataHora Entrada:</label>
            <p-calendar type="text" [showTime]="true" name="dataHoraEntrada" formControlName="dataHoraEntrada" />
          </div>
          <div class="col-4 xl:col-4 lg:col-4 md:col-4 sm:col-4 flex flex-column">
            <label htmlFor="residente">Residente:</label>
            <p-dropdown [options]="opcoesResidente" name="residente" formControlName="residente" />
          </div>
        </div>
        <br>
        <div class="flex flex-row justify-content-end gap-2">
          <button pButton class="p-button p-button-primary" type="submit">Salvar</button>
          <button pButton class="p-button p-button-secondary">Limpar</button>
        </div>
      </form>
    </div>
    <div class="col-12  xl:col-10 lg:col-10 md:col-10 sm:col-10 flex align-items-start">
      <p-button (click)="voltar()" pTooltip="Voltar" tooltipPosition="top" icon="pi pi-arrow-left"
        [style]="{'float': 'left'}" styleClass="p-button-rounded p-button-info p-button-text p-button-lg"></p-button>
    </div>
  </div>
