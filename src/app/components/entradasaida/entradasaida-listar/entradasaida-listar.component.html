<div>
    <p-button (click)="novo()" icon="pi pi-plus" pTooltip="Novo" tooltipPosition="bottom" icon="pi pi-plus" [rounded]="true" [text]="true" severity="info" size="large"></p-button>
    <p-table [value]="items" (sortFunction)="customSort($event)" [customSort]="true" [lazy]="true" (onLazyLoad)="customSort($event)">
        <ng-template pTemplate="header">
            <tr>
                <th pSortableColumn="id" style="width:10%">Id <p-sortIcon field="id"></p-sortIcon></th>
                <th pSortableColumn="dataHoraSaida" style="width:20%">DataHora Saída<p-sortIcon field="dataHoraSaida"></p-sortIcon></th>
                <th pSortableColumn="dataHoraEntrada" style="width:20%">DataHora Entrada <p-sortIcon field="dataHoraEntrada"></p-sortIcon></th>
                <th pSortableColumn="residente.nome" style="width:40%">Residente<p-sortIcon field="residente.nome"></p-sortIcon></th>
                <th style="width:10%">Ações</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-item>
            <tr>                
                <td>{{item.id}}</td>
                <td>{{item.dataHoraSaida | date:"dd/MM/yyyy HH:mm"}}</td>
                <td>{{item.dataHoraEntrada | date:"dd/MM/yyyy HH:mm"}}</td>
                <td>{{item.residente.nome}}</td>
                <td>
                    <div class="flex gap-1">
                        <p-button class="tablebutton" icon="pi pi-pencil" [rounded]="true" [outlined]="true" severity="secondary" (click)="edit(item.id)"></p-button>
                        <p-button class="tablebutton" icon="pi pi-trash" [rounded]="true" [outlined]="true" severity="danger" (click)="delete(item.id)"></p-button>
                    </div>
                </td>
            </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="5">Nenhum item cadastrado.</td>
            </tr>
        </ng-template>
    </p-table>
    <p-paginator (onPageChange)="onPageChange($event)" [first]="first" [rows]="rows" [totalRecords]="total" [rowsPerPageOptions]="[10, 20]"></p-paginator>
</div>
<p-blockUI [blocked]="carregando">
    <p-progressSpinner></p-progressSpinner>
</p-blockUI>
<p-confirmDialog></p-confirmDialog>
