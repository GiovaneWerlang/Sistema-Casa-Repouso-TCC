<div>
    <p-button (click)="novo()" icon="pi pi-plus" pTooltip="Novo" tooltipPosition="bottom" icon="pi pi-plus" styleClass="p-button-rounded p-button-info p-button-text p-button-lg"></p-button>
    <p-table [value]="items" (sortFunction)="customSort($event)" [customSort]="true" [lazy]="true" (onLazyLoad)="customSort($event)">
        <ng-template pTemplate="header">
            <tr>
                <th pSortableColumn="id" style="width:20%">Id <p-sortIcon field="id"></p-sortIcon></th>
                <th pSortableColumn="nome" style="width:20%">Nome<p-sortIcon field="nome"></p-sortIcon></th>
                <th pSortableColumn="dataHora" style="width:10%">DataHora<p-sortIcon field="dataHora"></p-sortIcon></th>
                <th pSortableColumn="local" style="width:20%">Local<p-sortIcon field="local"></p-sortIcon></th>
                <th pSortableColumn="residente.nome" style="width:20%">Residente<p-sortIcon field="residente.nome"></p-sortIcon></th>
                <th style="width:10%">Ações</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-item>
            <tr>                
                <td>{{item.id}}</td>
                <td>{{item.nome}}</td>
                <td>{{item.dataHora | date: 'dd/MM/yyyy hh:mm'}}</td>
                <td>{{item.local}}</td>
                <td>{{item.residente.nome}}</td>
                <td>
                    <div class="flex gap-1">
                        <p-button class="tablebutton" icon="pi pi-pencil" styleClass="p-button-rounded p-button-outlined p-button-secondary" (click)="edit(item.id)"></p-button>
                        <p-button class="tablebutton" icon="pi pi-trash" styleClass="p-button-rounded p-button-outlined p-button-danger" (click)="delete(item.id)"></p-button>
                    </div>
                </td>
            </tr>
        </ng-template>
    </p-table>
    <p-paginator (onPageChange)="onPageChange($event)" [first]="first" [rows]="rows" [totalRecords]="total" [rowsPerPageOptions]="[10, 20]"></p-paginator>
</div>
