<div class="header flex col-12 justify-content-between">    
    <app-side-menu *ngIf="!desktop"></app-side-menu>
    <p-button *ngIf="desktop" icon="pi pi-home" styleClass="p-button-rounded p-button-info p-button-text p-button-lg" (click)="home()"></p-button>
    <div class="flex flex-column">
        <p-button icon="pi pi-user" styleClass="p-button-rounded p-button-info p-button-text p-button-lg" (click)="menu.toggle($event)"></p-button>
        <p-menu #menu [model]="items" [popup]="true"></p-menu>
    </div>
</div>
