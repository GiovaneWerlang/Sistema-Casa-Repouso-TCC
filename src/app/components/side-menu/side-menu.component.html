<p-sidebar [(visible)]="sidebarVisible" [dismissible]="false" styleClass="w-20rem">
    <ng-template pTemplate="header">Header Content</ng-template>
    <ng-template pTemplate="content">
        <app-menu></app-menu>
    </ng-template>
    <ng-template pTemplate="footer">Footer Content</ng-template>
</p-sidebar>
<p-button type="button" icon="pi pi-bars" styleClass="p-button-rounded p-button-info p-button-text p-button-lg" (click)="sidebarVisible = true"></p-button>
