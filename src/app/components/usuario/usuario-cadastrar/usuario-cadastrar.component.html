<div class="col-12 flex flex-column align-items-center">
    <div class="col-12 xl:col-10 lg:col-10 md:col-10 sm:col-10">
        <p class="font-bold text-2xl" style="color: var(--primary-color);">Cadastro de Usuário</p>
        <form [formGroup]="form" (submit)="salvar()" class="flex flex-column">
            <div class="flex flex-row flex-wrap">
                <div class="col-12 flex flex-column">
                    <label htmlFor="login">Login:</label>
                    <input type="text" pInputText name="login" formControlName="login" />
                    <div *ngIf="form.controls['login']?.invalid && (form.controls['login']?.dirty || form.controls['login']?.touched)">
                        <small *ngIf="form.get('login')?.errors?.['required']" class="p-error">Este campo é obrigatório.</small>
                        <small *ngIf="form.get('login')?.errors?.['maxlength']" class="p-error">Tamanho máximo 50 caracteres.</small>
                    </div>
                </div>
                <div class="col-12 xl:col-4 lg:col-4 md:col-4 sm:col-12 flex flex-column">
                    <label htmlFor="senha">Senha:</label>
                    <input type="password" pInputText name="senha" formControlName="senha" />
                    <div *ngIf="form.controls['senha']?.invalid && (form.controls['senha']?.dirty || form.controls['senha']?.touched)">
                        <small *ngIf="form.get('senha')?.errors?.['required']" class="p-error">Este campo é obrigatório.</small>
                        <small *ngIf="form.get('senha')?.errors?.['minlength']" class="p-error">Tamanho mínimo 6 caracteres.</small>
                    </div>
                </div>
                <div class="col-12 xl:col-4 lg:col-4 md:col-4 sm:col-12 flex flex-column">
                    <label htmlFor="profissional">Profissional:</label>
                    <p-dropdown [options]="opcoesProfissional" name="profissional" formControlName="profissional" [filter]="true" [style]="{'width':'100%'}"/>
                </div>                
            </div>
            <br>
            <div class="flex flex-row justify-content-end gap-2">
                <button pButton class="p-button p-button-primary">Salvar</button>
                <button pButton class="p-button p-button-secondary" (click)="limpar()">Limpar</button>
            </div>
        </form>
    </div>
    <div class="col-12  xl:col-10 lg:col-10 md:col-10 sm:col-10 flex align-items-start">
        <p-button (click)="voltar()" pTooltip="Voltar" tooltipPosition="top" icon="pi pi-arrow-left"
            [style]="{'float': 'left'}"
            styleClass="p-button-rounded p-button-info p-button-text p-button-lg"></p-button>
    </div>
    <p-toast></p-toast>
</div>
