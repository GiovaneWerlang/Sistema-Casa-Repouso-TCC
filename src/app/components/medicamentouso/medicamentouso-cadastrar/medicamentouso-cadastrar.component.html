<div class="col-12 flex flex-column align-items-center">
    <div class="col-12 xl:col-10 lg:col-10 md:col-10 sm:col-10">
        <p>Cadastro de Medicamento em Uso</p>
        <form [formGroup]="form" (submit)="salvar()" class="flex flex-column">
            <div class="flex flex-row flex-wrap">
                <div class="col-12 xl:col-4 lg:col-4 md:col-4 sm:col-12 flex flex-column">
                    <label htmlFor="intervalo">Intervalo:</label>
                    <input type="number" pInputText pKeyFilter="int" name="intervalo" formControlName="intervalo" />
                </div>
                <div class="col-4 xl:col-4 lg:col-4 md:col-4 sm:col-4 flex flex-column">
                    <label htmlFor="dataHoraInicio">DataHora Início:</label>
                    <p-calendar type="text" [showTime]="true" name="dataHoraInicio" formControlName="dataHoraInicio" />
                  </div>
                <div class="col-12 xl:col-4 lg:col-4 md:col-4 sm:col-12 flex flex-column">
                    <label htmlFor="qtdeVezesAoDia">Vezes ao dia:</label>
                    <input type="number" pInputText pKeyFilter="int" name="qtdeVezesAoDia" formControlName="qtdeVezesAoDia" />
                </div>
                <div class="col-12 xl:col-4 lg:col-4 md:col-4 sm:col-12 flex flex-column">
                    <label htmlFor="qtdeDiasUso">Quantidade de dias:</label>
                    <input type="number" pInputText pKeyFilter="int" name="qtdeDiasUso" formControlName="qtdeDiasUso" />
                </div>
                <div class="col-12 xl:col-4 lg:col-4 md:col-4 sm:col-12 flex flex-column">
                    <label htmlFor="qtdeMedicamento">Quantidade de Medicamento:</label>
                    <input type="number" pInputText pKeyFilter="int" name="qtdeMedicamento" formControlName="qtdeMedicamento" />
                </div>
                <div class="col-12 xl:col-4 lg:col-4 md:col-4 sm:col-12 flex flex-column">
                    <label htmlFor="medicamento">Medicamento:</label>
                    <p-dropdown [options]="opcoesMedicamento" name="medicamento" formControlName="medicamento"
                        [filter]="true" />
                </div>
                <div class="col-12 xl:col-4 lg:col-4 md:col-4 sm:col-12 flex flex-column">
                    <label htmlFor="residente">Residente:</label>
                    <p-dropdown [options]="opcoesResidente" name="residente" formControlName="residente"
                        [filter]="true" />
                </div>
            </div>
            <br>
            <div class="flex flex-row justify-content-end gap-2">
                <button pButton class="p-button p-button-primary" type="submit">Salvar</button>
                <button pButton class="p-button p-button-secondary">Limpar</button>
            </div>
        </form>
    </div>
    <div class="col-12  xl:col-10 lg:col-10 md:col-10 sm:col-10 flex align-items-start">
        <p-button (click)="voltar()" pTooltip="Voltar" tooltipPosition="top" icon="pi pi-arrow-left"
            [style]="{'float': 'left'}"
            styleClass="p-button-rounded p-button-info p-button-text p-button-lg"></p-button>
    </div>
</div>
