#Desenvolvimento
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=admin

quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/tymed
quarkus.datasource.jdbc.max-size=16

quarkus.flyway.migrate-at-start=true

quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.filter=true

quarkus.http.cors=true
quarkus.http.cors.methods=GET,PUT,POST,DELETE
quarkus.http.cors.headers=accept, origin, authorization, content-type, x-requested-with
quarkus.http.cors.origins=http://localhost:4200
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.database.default-schema=public

mp.jwt.verify.publickey.location=publickey.pem
mp.jwt.verify.privatekey.location=privatekey.pem

smallrye.jwt.sign.key.location=privatekey.pem
smallrye.jwt.encrypt.key=publickey.pem

mp.jwt.verify.issuer=https://tymed.com/security
quarkus.native.resources.includes=publickey.pem,privatekey.pem

email.login = ${EMAILLOGIN}
email.senha = ${EMAILSENHA}
whatsapp.numeroid = ${WHATSNUMEROID}
whatsapp.token = ${WHATSTOKEN}

#Testes
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:db
%test.quarkus.datasource.jdbc.max-size=16
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=sa
%test.quarkus.hibernate-orm.log.sql=true